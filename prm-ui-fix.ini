[Font]
Enabled=1
AddSize=0
[UI]
Enabled=1
ScalePercent=150
; Native smoothing by default; F3 compares with crisp point sampling.
SharpFilter=0
OriginX=0
OriginY=0
ScreenWidth=3440
ScreenHeight=1440
AnchorMode=1
GroupGap=12
MatchGap=40
StableMatchGap=96
GlobalThresholdPercent=65
ScaleGlobal=0
ScaleUnmatched=0
KeepOnScreen=1
[Input]
Enabled=1
HitRegionMaxAgeMs=250
; Keep UI inverse mapping out of the terrain ray used for click-to-move.
; Compare full renderer dimensions with the live client rectangle (not the INI).
; Equal sizes are identity; normalize only when the live dimensions differ.
[WorldInput]
Enabled=1
NormalizeToScreen=1
; Whole-window bitmap ownership is the primary UI path.
[OwnerBitmap]
Enabled=1
; Legacy scoped CPU-helper matching remains available with OwnerBitmap.Enabled=0.
; MaxAgePresents applies only to that comparison mode.
[OwnerSubmit]
Enabled=1
; Intercept every direct callsite to the validated UIWindow drawing helpers.
; Runtime RTTI admits UI*Wnd/UI*Window objects; helper entries stay untouched.
AllWindowCalls=1
; Own hover/description visuals without publishing noninteractive mouse regions.
TooltipEnabled=1
MatchTolerance=4
MaxAgePresents=96
OwnerInputEnabled=1
; Input activity is now independent from deferred D3D matching.
; UIWindowMgr membership keeps an open learned window active. This grace is
; only a fallback for brief manager-list timing gaps after a scoped helper call.
OwnerInputGracePresents=24
; A recent exact D3D owner draw can override helper-order overlap selection.
; Older exact draws are ignored for input z-order so deferred flushes cannot
; keep a stale window artificially on top.
OwnerInputExactAgePresents=4
[VirtualTrace]
Enabled=0
CaptureMs=2000
SlotFirst=0
SlotLast=39
[Trace]
Enabled=0
CaptureMs=2000
